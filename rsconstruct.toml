# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.generator.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_dirs = ["src", "exercises", "examples/low_level/ffi_to_c"]
src_files = ["README.md"]

[processor.checker.zspell]
src_dirs = ["src", "exercises"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.checker.ruff]
src_dirs = ["src", "scripts", "config", "exercises"]


[processor.checker.mypy]
src_dirs = ["src", "scripts", "config", "exercises"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.checker.shellcheck]
src_dirs = ["scripts", "src", "exercises", "config"]
src_files = [".auto.enter.sh", ".auto.exit.sh"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.checker.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_dirs = ["examples", "exercises"]
src_files = [".rumdl.toml", "Cargo.toml", "pyproject.toml", "rsconstruct.toml"]

# Compile the standalone rust demos the way the pydmt Makefile did: rustc on
# each src/*.rs in both release (-O, no debuginfo) and debug (-g), all with
# -Dwarnings. Two instances, one per profile, since output_suffix differs.
# examples/ and exercises/ are a curated cargo workspace whose root Cargo.toml
# lists its members (some example dirs are deliberately not members). The
# Makefile ran one `cargo build` at the root; the cargo processor instead
# discovers every Cargo.toml and trips on the non-members, so run the root
# workspace build explicitly, exactly as the Makefile did.
# cargo owns target/ and its own incremental cache, so target/ is NOT declared
# as an output here: rsconstruct hardlink-restores cached outputs read-only,
# which leaves target/ unwritable and breaks the next `cargo` run. The declared
# output is a small stamp the build script writes on success; cargo manages
# target/ itself.
[processor.explicit.generic.cargo]
command = "scripts/cargo_build.py"
inputs = ["Cargo.toml"]
input_globs = ["examples/**/*.rs", "exercises/**/*.rs", "examples/**/Cargo.toml", "exercises/**/Cargo.toml"]
output_files = ["out/cargo.stamp"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

[processor.checker.cppcheck]
src_dirs = ["examples/low_level/ffi_to_c/src", "standalone/c_interface"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]
