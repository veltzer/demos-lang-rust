# rsconstruct build configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src", "exercises"]

[processor.zspell]
src_dirs = ["src", "exercises"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "scripts", "config", "exercises"]

[processor.pylint]
src_dirs = ["src", "scripts", "config", "exercises"]

[processor.mypy]
src_dirs = ["src", "scripts", "config", "exercises"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "src", "exercises", "config"]
args = ["--severity=error", "--shell=bash"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# Compile the standalone rust demos the way the pydmt Makefile did: rustc on
# each src/*.rs in both release (-O, no debuginfo) and debug (-g), all with
# -Dwarnings. Two instances, one per profile, since output_suffix differs.
# examples/ and exercises/ are a curated cargo workspace whose root Cargo.toml
# lists its members (some example dirs are deliberately not members). The
# Makefile ran one `cargo build` at the root; the cargo processor instead
# discovers every Cargo.toml and trips on the non-members, so run the root
# workspace build explicitly, exactly as the Makefile did.
[processor.explicit.cargo]
command = "scripts/cargo_build.py"
inputs = ["Cargo.toml"]
input_globs = ["examples/**/*.rs", "exercises/**/*.rs", "examples/**/Cargo.toml", "exercises/**/Cargo.toml"]
output_dirs = ["target"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
